$kind: http-request
name: 1. GET /418 (немає в кеші)
url: "{{baseUrl}}/418"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Код стану 200\", () => {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Content-Type є картинкою\", () => {\r

      \    pm.expect(pm.response.headers.get(\"Content-Type\")).to.include(\"image/\");\r

      });\r

      \r

      pm.test(\"Джерело — http.cat\", () => {\r

      \    pm.expect(pm.response.headers.get(\"X-Cache\")).to.eql(\"MISS\");\r

      });"
    language: text/javascript
order: 8000
