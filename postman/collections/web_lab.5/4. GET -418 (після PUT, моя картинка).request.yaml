$kind: http-request
name: 4. GET /418 (після PUT, моя картинка)
url: "{{baseUrl}}/418"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Код стану 200\", () => { pm.response.to.have.status(200); });\r

      \r

      pm.test(\"Content-Type є картинкою\", () => {\r

      \    pm.expect(pm.response.headers.get(\"Content-Type\")).to.include(\"image/\");\r

      });\r

      pm.test(\"Джерело — кеш\", () => {\r

      \    pm.expect(pm.response.headers.get(\"X-Cache\")).to.eql(\"HIT\");\r

      });"
    language: text/javascript
order: 5000
